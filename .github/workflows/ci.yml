name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      gate-mode: ${{ steps.runtime-policy.outputs.gate-mode }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Determine changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          fetch_commit() {
            local sha="$1"
            local fallback_ref="${2:-}"
            if [ -z "$sha" ]; then
              return 1
            fi
            if git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              return 0
            fi
            if git fetch --no-tags --depth=1 origin "$sha" 2>/dev/null; then
              git cat-file -e "${sha}^{commit}" 2>/dev/null
              return $?
            fi
            if [ -n "$fallback_ref" ] && git fetch --no-tags --depth=1 origin "$fallback_ref" 2>/dev/null; then
              git cat-file -e "${sha}^{commit}" 2>/dev/null
              return $?
            fi
            return 1
          }
          diff_ready=false
          if [ "$EVENT_NAME" = "pull_request" ] \
            && fetch_commit "$PR_BASE_SHA" "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}" \
            && fetch_commit "$PR_HEAD_SHA" "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head"; then
            git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" > "$RUNNER_TEMP/changed-paths.txt"
            diff_ready=true
          elif [ "$EVENT_NAME" = "push" ] \
            && [ -n "$BEFORE_SHA" ] \
            && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
            && fetch_commit "$BEFORE_SHA"; then
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > "$RUNNER_TEMP/changed-paths.txt"
            diff_ready=true
          fi
          if [ "$diff_ready" != "true" ]; then
            echo "::notice title=ci-runtime-policy::changed paths unavailable; falling back to full-repository path set"
            git ls-files > "$RUNNER_TEMP/changed-paths.txt"
          fi
          cat "$RUNNER_TEMP/changed-paths.txt"

      - name: Classify CI runtime policy
        id: runtime-policy
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          VALIDATION_STATUS="$(python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/reports/handoff-packages/latest/validation_report.json")
          print(json.loads(path.read_text(encoding="utf-8")).get("status", "") if path.exists() else "")
          PY
          )"
          PYTHONPATH=src python -m agentic_project_kit.ci_runtime_policy admin-refresh \
            --changed-paths-file "$RUNNER_TEMP/changed-paths.txt" \
            --branch "$BRANCH_NAME" \
            --validation-status "$VALIDATION_STATUS" \
            --output "$RUNNER_TEMP/admin-refresh-policy.json"
          FINAL_TREE=""
          if [ "$EVENT_NAME" = "push" ]; then
            FINAL_TREE="$(git rev-parse "${CURRENT_SHA}^{tree}" 2>/dev/null || true)"
          fi
          TESTED_TREE=""
          PR_CHECKS_PASSED="unknown"
          if [ "$EVENT_NAME" = "push" ]; then
            PYTHONPATH=src python -m agentic_project_kit.ci_github_proof \
              --repo "$GITHUB_REPOSITORY" \
              --current-sha "$CURRENT_SHA" \
              --base-branch main \
              --required-workflow CI \
              --required-check test \
              --output "$RUNNER_TEMP/main-push-pr-proof.json"
            TESTED_TREE="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          proof = json.loads(Path(os.environ["RUNNER_TEMP"], "main-push-pr-proof.json").read_text(encoding="utf-8"))
          print(proof.get("tested_tree_sha", "") if proof.get("status") == "PASS" else "")
          PY
          )"
            PR_CHECKS_PASSED="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          proof = json.loads(Path(os.environ["RUNNER_TEMP"], "main-push-pr-proof.json").read_text(encoding="utf-8"))
          print("true" if proof.get("status") == "PASS" and proof.get("pr_checks_passed") is True else "false")
          PY
          )"
          fi
          PYTHONPATH=src python -m agentic_project_kit.ci_runtime_policy main-push \
            --changed-paths-file "$RUNNER_TEMP/changed-paths.txt" \
            --event-name "$EVENT_NAME" \
            --final-tree "$FINAL_TREE" \
            --tested-tree "$TESTED_TREE" \
            --pr-checks-passed "$PR_CHECKS_PASSED" \
            --output "$RUNNER_TEMP/main-push-policy.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          admin = json.loads(Path(os.environ["RUNNER_TEMP"], "admin-refresh-policy.json").read_text(encoding="utf-8"))
          main_push = json.loads(Path(os.environ["RUNNER_TEMP"], "main-push-policy.json").read_text(encoding="utf-8"))
          gate_mode = "full"
          if admin["mode"] == "ADMIN_REFRESH_LIGHT":
              gate_mode = "admin-refresh-light"
          if main_push["mode"] == "TREE_PROOF":
              gate_mode = "tree-proof"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"gate-mode={gate_mode}\n")
          PY

      - name: Keep the runtime policy for the required test job
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-policy
          path: |
            ${{ runner.temp }}/admin-refresh-policy.json
            ${{ runner.temp }}/main-push-policy.json
            ${{ runner.temp }}/changed-paths.txt
          if-no-files-found: error
          retention-days: 5

  test-shard:
    # Deterministic pytest shards (agentic_project_kit.ci_test_shards); the required test job
    # accepts them only when together they ran the whole collected suite. In a light or
    # tree-proof gate a shard succeeds without work, so no check is ever reported as skipped.
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - name: Shard not needed in this gate mode
        if: needs.classify.outputs.gate-mode != 'full'
        run: |
          echo "gate mode ${{ needs.classify.outputs.gate-mode }} - this shard has nothing to run"

      - uses: actions/checkout@v6
        if: needs.classify.outputs.gate-mode == 'full'
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        if: needs.classify.outputs.gate-mode == 'full'
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package
        if: needs.classify.outputs.gate-mode == 'full'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch pinned historical wheel fixture
        if: needs.classify.outputs.gate-mode == 'full'
        run: |
          git fetch --no-tags --depth=1 origin refs/tags/v1.0.24:refs/tags/v1.0.24
          test "$(git rev-parse 'v1.0.24^{commit}')" = "3ba42bacb3be96d0a344087b8464bd21f12b9de7"

      - name: Tests (shard)
        if: needs.classify.outputs.gate-mode == 'full'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/test-shard-${{ matrix.shard }}"
          python -m pytest -q --collect-only --shard-index ${{ matrix.shard }} --shard-count 3 --write-collected "$RUNNER_TEMP/test-shard-${{ matrix.shard }}/collected.txt" > /dev/null
          python -m pytest -q -n 4 --dist worksteal --durations=20 --shard-index ${{ matrix.shard }} --shard-count 3 --junitxml "$RUNNER_TEMP/test-shard-${{ matrix.shard }}/junit.xml"

      - name: Keep the shard report
        if: needs.classify.outputs.gate-mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: test-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 5

  test:
    # The required check: the classification, the light and tree-proof gates and the verdict on
    # the shards stay in this one job, whose name the Kit's PR proofs require.
    needs: [classify, test-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Upstream jobs succeeded
        shell: bash
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: |
          set -euo pipefail
          test "$CLASSIFY_RESULT" = success || { echo "classify: $CLASSIFY_RESULT" >&2; exit 1; }
          test "$SHARD_RESULT" = success || { echo "test-shard: $SHARD_RESULT" >&2; exit 1; }

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Runtime policy from the classify job
        uses: actions/download-artifact@v7
        with:
          name: ci-runtime-policy
          path: ${{ runner.temp }}

      - name: Install package
        if: needs.classify.outputs.gate-mode != 'tree-proof'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        if: needs.classify.outputs.gate-mode == 'full'
        run: ruff check .

      - name: Fetch pinned historical wheel fixture
        if: needs.classify.outputs.gate-mode == 'full'
        run: |
          git fetch --no-tags --depth=1 origin refs/tags/v1.0.24:refs/tags/v1.0.24
          test "$(git rev-parse 'v1.0.24^{commit}')" = "3ba42bacb3be96d0a344087b8464bd21f12b9de7"

      - name: Collect the full suite
        if: needs.classify.outputs.gate-mode == 'full'
        run: python -m pytest -q --collect-only --write-collected "$RUNNER_TEMP/collected-full.txt" > /dev/null

      - name: Fetch the shard reports
        if: needs.classify.outputs.gate-mode == 'full'
        uses: actions/download-artifact@v7
        with:
          pattern: test-shard-*
          path: ${{ runner.temp }}/shards

      - name: Tests
        if: needs.classify.outputs.gate-mode == 'full'
        run: python -m agentic_project_kit.ci_test_shards check --full "$RUNNER_TEMP/collected-full.txt" --shards-dir "$RUNNER_TEMP/shards" --count 3

      - name: CLI smoke
        if: needs.classify.outputs.gate-mode == 'full'
        run: |
          agentic-kit --help
          agentic-kit todo --help

      - name: Admin refresh light gate
        if: needs.classify.outputs.gate-mode == 'admin-refresh-light'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The diff endpoints live in the classify job's clone; fetch them here (fail closed below).
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA" "$PR_HEAD_SHA" \
              || git fetch --no-tags --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head" "$PR_BASE_SHA" \
              || true
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA" || true
          fi
          POLICY_MUTATION="$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          policy = json.loads(Path(os.environ["RUNNER_TEMP"], "admin-refresh-policy.json").read_text(encoding="utf-8"))
          print(policy.get("mutation", "none"))
          PY
          )"
          agentic-kit handoff check
          validate_successor_package() {
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("docs/reports/handoff-packages/latest/validation_report.json").read_text(encoding="utf-8"))
          if report.get("status") != "PASS" or report.get("findings"):
              raise SystemExit("successor handoff validation_report.json is not PASS")
          print(json.dumps(report, indent=2, sort_keys=True))
          PY
          }
          case "$POLICY_MUTATION" in
            current-handoff-refresh)
              agentic-kit dpa current-handoff-refresh --json
              ;;
            successor-package-refresh)
              validate_successor_package
              ;;
            post-merge-settle-refresh)
              agentic-kit dpa current-handoff-refresh --json
              validate_successor_package
              ;;
            *)
              echo "unexpected admin refresh mutation: $POLICY_MUTATION" >&2
              exit 1
              ;;
          esac
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ] && [ -n "$PR_HEAD_SHA" ]; then
            git diff "$PR_BASE_SHA" "$PR_HEAD_SHA" --output "$RUNNER_TEMP/admin-refresh.diff"
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff "$BEFORE_SHA" "$CURRENT_SHA" --output "$RUNNER_TEMP/admin-refresh.diff"
          else
            echo "cannot determine admin refresh diff endpoints for $EVENT_NAME" >&2
            exit 1
          fi
          python -m agentic_project_kit.protected_change_planner --diff-file "$RUNNER_TEMP/admin-refresh.diff"
          agentic-kit transfer protected-diff-plan --label ci-admin-refresh-clean-worktree --json
          agentic-kit doc-registry reconcile --json
          agentic-kit doc-registry check-unregistered --json
          agentic-kit check-docs
          python -m pytest -q tests/test_successor_handoff_package.py tests/test_chat_entrypoint_contract.py tests/test_documentation_registry.py tests/test_docs_lifecycle_apply_cli.py tests/test_docs_lifecycle_reconcile_cli.py tests/test_ci_runtime_policy.py

      - name: Main push tree proof gate
        if: needs.classify.outputs.gate-mode == 'tree-proof'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          policy = json.loads(Path(os.environ["RUNNER_TEMP"], "main-push-policy.json").read_text(encoding="utf-8"))
          if policy["mode"] != "TREE_PROOF":
              raise SystemExit("main-push tree proof gate selected without TREE_PROOF policy")
          print(json.dumps(policy, indent=2, sort_keys=True))
          PY

  pytest-parallel-shadow:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch pinned historical wheel fixture
        run: |
          git fetch --no-tags --depth=1 origin refs/tags/v1.0.24:refs/tags/v1.0.24
          test "$(git rev-parse 'v1.0.24^{commit}')" = "3ba42bacb3be96d0a344087b8464bd21f12b9de7"

      - name: Pytest parallel shadow
        shell: bash
        run: |
          set +e
          python -m pytest -q -n 4 --durations=20
          rc=$?
          echo "PYTEST_PARALLEL_SHADOW_RC=$rc"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=pytest-parallel-shadow::diagnostic shadow pytest failed with exit code $rc"
          fi
          exit 0
