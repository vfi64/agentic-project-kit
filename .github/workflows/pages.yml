name: Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-required: ${{ steps.policy.outputs.build-required }}
      gate-mode: ${{ steps.policy.outputs.gate-mode }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > "$RUNNER_TEMP/changed-paths.txt" || git ls-files > "$RUNNER_TEMP/changed-paths.txt"
          else
            git ls-files > "$RUNNER_TEMP/changed-paths.txt"
          fi
          cat "$RUNNER_TEMP/changed-paths.txt"

      - name: Evaluate Pages path gate
        id: policy
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m agentic_project_kit.ci_runtime_policy pages \
            --changed-paths-file "$RUNNER_TEMP/changed-paths.txt" \
            --event-name "$EVENT_NAME" \
            --manifest site/pages_input_manifest.json \
            --output "$RUNNER_TEMP/pages-policy.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          policy = json.loads(Path(os.environ["RUNNER_TEMP"], "pages-policy.json").read_text(encoding="utf-8"))
          build_required = policy["mode"] == "BUILD_REQUIRED"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"build-required={str(build_required).lower()}\n")
              output.write(f"gate-mode={policy['mode']}\n")
          PY

  pages-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy-ready: ${{ steps.pages.outputs.deploy-ready }}

    steps:
      - id: pages
        uses: actions/github-script@v8
        with:
          script: |
            try {
              const response = await github.request(
                "GET /repos/{owner}/{repo}/pages",
                context.repo
              );
              const buildType = response.data.build_type || "";
              const deployReady = buildType === "workflow";
              if (!deployReady) {
                core.notice("GitHub Pages exists but is not configured for GitHub Actions deployment.");
              }
              core.setOutput("deploy-ready", String(deployReady));
            } catch (error) {
              if (error.status === 404) {
                core.notice("GitHub Pages is not enabled yet; skipping deployment after a successful build.");
                core.setOutput("deploy-ready", "false");
                return;
              }
              throw error;
            }

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - pages-gate
      - pages-state
    if: needs.pages-gate.outputs.build-required == 'true'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build generated site
        run: python site/scripts/build.py --output site/dist --json

      - name: Site tests
        run: python -m pytest tests/test_site_generator.py tests/test_site_claims.py -q

      - uses: actions/configure-pages@v5
        if: needs.pages-state.outputs.deploy-ready == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: needs.pages-state.outputs.deploy-ready == 'true'
        with:
          path: site/dist

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - pages-gate
      - pages-state
      - build
    if: needs.pages-gate.outputs.build-required == 'true' && needs.pages-state.outputs.deploy-ready == 'true'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
