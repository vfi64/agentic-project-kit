<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" role="img" aria-labelledby="title desc">
<title id="title">File Transfer</title><desc id="desc">You to Kit and repository: Start new work. You to Kit and repository: Send your task so the Kit publishes it to the repository. Command: agentic-kit transfer submit-user-task. You to AI assistant: Write g in the chat. AI assistant to Kit and repository: Read the published task before working. Command: agentic-kit transfer read-user-task. You to Kit and repository: Run Check, then use Finish &amp; publish after review.</desc>
