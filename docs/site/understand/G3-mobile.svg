<svg xmlns="http://www.w3.org/2000/svg" width="360" height="782" viewBox="0 0 360 782" role="img" aria-labelledby="title desc"><title id="title">Context survives the chat</title><desc id="desc">A generated package preserves inspectable context. It does not prove requirements or software correctness.</desc><rect width="360" height="782" fill="#ecf5ef" rx="18"/><g font-family="system-ui,sans-serif" font-size="18" fill="#16302b"><text x="20" y="32" font-size="23" font-weight="700">Context survives the</text><text x="20" y="62" font-size="23" font-weight="700">chat</text><text x="20" y="102" font-size="13">Contract view · not a runtime trace</text><rect x="16" y="128" width="328" height="104" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="156" font-size="17" font-weight="700">1. Repository sources</text><text x="30" y="188" font-size="15">source_manifest.json records the</text><text x="30" y="210" font-size="15">inputs.</text><path d="M180 234 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="264" width="328" height="170" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="292" font-size="17" font-weight="700">2. Successor package</text><text x="30" y="324" font-size="15">execution_contract.json,</text><text x="30" y="346" font-size="15">source_manifest.json,</text><text x="30" y="368" font-size="15">successor_context.yaml,</text><text x="30" y="390" font-size="15">successor_prompt.md,</text><text x="30" y="412" font-size="15">validation_report.json</text><path d="M180 436 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="466" width="328" height="126" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="494" font-size="17" font-weight="700">3. Validate, then continue</text><text x="30" y="526" font-size="15">Read validation_report.json and</text><text x="30" y="548" font-size="15">execution_contract.json. A failed</text><text x="30" y="570" font-size="15">handoff blocks continuation.</text><path d="M180 594 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="624" width="328" height="126" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="652" font-size="17" font-weight="700">4. Successor chat</text><text x="30" y="684" font-size="15">Use successor_context.yaml and</text><text x="30" y="706" font-size="15">successor_prompt.md; inspect</text><text x="30" y="728" font-size="15">current repository state.</text></g></svg>
