<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 700" role="img" aria-labelledby="g3mt g3md" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" width="380" height="700">
<title id="g3mt">Context survives the chat</title>
<desc id="g3md">A generated package preserves inspectable context. It does not prove requirements or software correctness. Handoff does not rely on chat memory. On validation failure, inspect the failure, fix its cause, and revalidate before continuing. Repository sources: source_manifest.json records the inputs. Successor package: execution_contract.json, source_manifest.json, successor_context.yaml, successor_prompt.md, validation_report.json Validate, then continue: Read validation_report.json and execution_contract.json. A failed handoff blocks continuation. Successor chat: Use successor_context.yaml and successor_prompt.md; inspect current repository state.</desc>
<defs><marker id="m3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e" /></marker><marker id="m3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b42318" /></marker></defs>
<rect width="380" height="700" rx="14" fill="#edf3f1" />
<text x="16" y="32" font-size="19" font-weight="700" fill="#17202a">Context survives the chat</text>
<text x="16" y="52" font-size="12" fill="#586674">The repository carries the state, not the chat</text>
<rect x="16" y="70" width="220" height="84" rx="12" fill="#fff" stroke="#c8d3dc" stroke-width="1.5" /><text x="30" y="96" font-size="15" font-weight="700" fill="#17202a">Chat A</text><text x="30" y="118" font-size="13" fill="#17202a">work finished, handed off</text><text x="30" y="138" font-size="13" fill="#586674">then the session ends</text>
<g transform="translate(300 112)"><circle r="13" fill="#fff" stroke="#b42318" stroke-width="1.5" /><path d="M-6 -6L6 6M6 -6L-6 6" stroke="#b42318" stroke-width="2" /></g><text x="300" y="144" font-size="11" fill="#586674" text-anchor="middle">handoff does</text><text x="300" y="158" font-size="9.5" fill="#586674" text-anchor="middle">not rely on memory</text>
<line x1="126" y1="154" x2="126" y2="182" stroke="#0f766e" stroke-width="2" marker-end="url(#m3a)" /><text x="134" y="173" font-size="12" fill="#0f766e">writes</text>
<rect x="16" y="186" width="348" height="250" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2" /><text x="30" y="212" font-size="15" font-weight="700" fill="#0f766e">Repository</text><text x="30" y="230" font-size="12" fill="#586674">versioned with the project</text>
<rect x="30" y="242" width="320" height="180" rx="8" fill="#edf3f1" /><text x="44" y="264" font-size="14" font-weight="700" fill="#17202a">Successor package</text>
<rect x="44" y="276" width="146" height="26" rx="5" fill="#fff" stroke="#c8d3dc" /><text x="54" y="294" font-size="12.5" fill="#17202a">project context</text>
<rect x="196" y="276" width="146" height="26" rx="5" fill="#fff" stroke="#c8d3dc" /><text x="206" y="294" font-size="12.5" fill="#17202a">next-chat prompt</text>
<rect x="44" y="310" width="146" height="26" rx="5" fill="#fff" stroke="#c8d3dc" /><text x="54" y="328" font-size="12.5" fill="#17202a">rules and commands</text>
<rect x="196" y="310" width="146" height="26" rx="5" fill="#fff" stroke="#c8d3dc" /><text x="206" y="328" font-size="12.5" fill="#17202a">source identities</text>
<rect x="44" y="344" width="298" height="26" rx="5" fill="#fff" stroke="#0f766e" /><text x="54" y="362" font-size="12.5" font-weight="700" fill="#0f766e">validation report</text>
<text x="44" y="400" font-size="12" fill="#586674">generated and checked,</text><text x="44" y="416" font-size="12" fill="#586674">not written by hand</text>
<line x1="126" y1="436" x2="126" y2="456" stroke="#0f766e" stroke-width="2" marker-end="url(#m3a)" />
<path d="M126 458 L182 490 L126 522 L70 490 Z" fill="#fff" stroke="#17202a" stroke-width="1.5" /><text x="126" y="487" font-size="12" font-weight="700" fill="#17202a" text-anchor="middle">package</text><text x="126" y="502" font-size="12" font-weight="700" fill="#17202a" text-anchor="middle">valid?</text>
<line x1="182" y1="490" x2="270" y2="490" stroke="#b42318" stroke-width="2" marker-end="url(#m3r)" /><text x="188" y="484" font-size="12" font-weight="700" fill="#b42318">no</text>
<rect x="272" y="452" width="100" height="76" rx="10" fill="#fff" stroke="#b42318" stroke-width="1.5" /><text x="284" y="476" font-size="14" font-weight="700" fill="#b42318">Stop</text><text x="284" y="496" font-size="12" fill="#17202a">diagnose, fix,</text><text x="284" y="512" font-size="12" fill="#17202a">revalidate</text>
<line x1="126" y1="522" x2="126" y2="548" stroke="#0f766e" stroke-width="2" marker-end="url(#m3a)" /><text x="134" y="540" font-size="12" font-weight="700" fill="#0f766e">yes</text>
<rect x="16" y="552" width="220" height="104" rx="12" fill="#fff" stroke="#c8d3dc" stroke-width="1.5" /><text x="30" y="578" font-size="15" font-weight="700" fill="#17202a">Chat B</text><text x="30" y="600" font-size="13" fill="#17202a">reads the package</text><text x="30" y="620" font-size="13" fill="#17202a">re-checks repository state</text><text x="30" y="640" font-size="13" fill="#586674">then continues</text>
<text x="16" y="686" font-size="11.5" fill="#586674">Contract view, not a runtime trace.</text></svg>
