<svg xmlns="http://www.w3.org/2000/svg" width="360" height="750" viewBox="0 0 360 750" role="img" aria-labelledby="title desc"><title id="title">Context survives the chat</title><desc id="desc">A generated package preserves inspectable context. It does not prove requirements or software correctness.</desc><rect width="360" height="750" fill="#ecf5ef" rx="18"/><g font-family="system-ui,sans-serif" font-size="18" fill="#16302b"><text x="20" y="32" font-size="23" font-weight="700">Context survives the</text><text x="20" y="62" font-size="23" font-weight="700">chat</text><rect x="16" y="96" width="328" height="104" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="124" font-size="17" font-weight="700">1. Repository sources</text><text x="30" y="156" font-size="15">source_manifest.json records the</text><text x="30" y="178" font-size="15">inputs.</text><path d="M180 202 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="232" width="328" height="170" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="260" font-size="17" font-weight="700">2. Successor package</text><text x="30" y="292" font-size="15">execution_contract.json,</text><text x="30" y="314" font-size="15">source_manifest.json,</text><text x="30" y="336" font-size="15">successor_context.yaml,</text><text x="30" y="358" font-size="15">successor_prompt.md,</text><text x="30" y="380" font-size="15">validation_report.json</text><path d="M180 404 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="434" width="328" height="126" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="462" font-size="17" font-weight="700">3. Validate, then continue</text><text x="30" y="494" font-size="15">Read validation_report.json and</text><text x="30" y="516" font-size="15">execution_contract.json. A failed</text><text x="30" y="538" font-size="15">handoff blocks continuation.</text><path d="M180 562 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="592" width="328" height="126" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="620" font-size="17" font-weight="700">4. Successor chat</text><text x="30" y="652" font-size="15">Use successor_context.yaml and</text><text x="30" y="674" font-size="15">successor_prompt.md; inspect</text><text x="30" y="696" font-size="15">current repository state.</text></g></svg>
