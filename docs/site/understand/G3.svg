<svg xmlns="http://www.w3.org/2000/svg" width="640" height="610" viewBox="0 0 640 610" role="img" aria-labelledby="title desc"><title id="title">Context survives the chat</title><desc id="desc">A generated package preserves inspectable context. It does not prove requirements or software correctness.</desc><rect width="640" height="610" fill="#ecf5ef" rx="18"/><g font-family="system-ui,sans-serif" font-size="18" fill="#16302b"><text x="20" y="32" font-size="23" font-weight="700">Context survives the chat</text><rect x="16" y="66" width="608" height="82" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="94" font-size="17" font-weight="700">1. Repository sources</text><text x="30" y="126" font-size="15">source_manifest.json records the inputs.</text><path d="M320 150 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="180" width="608" height="126" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="208" font-size="17" font-weight="700">2. Successor package</text><text x="30" y="240" font-size="15">execution_contract.json, source_manifest.json,</text><text x="30" y="262" font-size="15">successor_context.yaml, successor_prompt.md,</text><text x="30" y="284" font-size="15">validation_report.json</text><path d="M320 308 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="338" width="608" height="104" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="366" font-size="17" font-weight="700">3. Validate, then continue</text><text x="30" y="398" font-size="15">Read validation_report.json and execution_contract.json. A failed</text><text x="30" y="420" font-size="15">handoff blocks continuation.</text><path d="M320 444 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="474" width="608" height="104" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="502" font-size="17" font-weight="700">4. Successor chat</text><text x="30" y="534" font-size="15">Use successor_context.yaml and successor_prompt.md; inspect</text><text x="30" y="556" font-size="15">current repository state.</text></g></svg>
