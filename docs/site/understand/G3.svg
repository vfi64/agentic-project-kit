<svg xmlns="http://www.w3.org/2000/svg" width="640" height="622" viewBox="0 0 640 622" role="img" aria-labelledby="title desc"><title id="title">Context survives the chat</title><desc id="desc">A generated package preserves inspectable context. It does not prove requirements or software correctness.</desc><rect width="640" height="622" fill="#ecf5ef" rx="18"/><g font-family="system-ui,sans-serif" font-size="18" fill="#16302b"><text x="24" y="40" font-size="23" font-weight="700">Context survives the chat</text><rect x="20" y="70" width="600" height="84" rx="14" fill="white" stroke="#0f766e"/><text x="40" y="100" font-weight="700">1. Repository sources</text><text x="40" y="128" font-size="15">source_manifest.json records the inputs.</text><path d="M320 156 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="20" y="186" width="600" height="128" rx="14" fill="white" stroke="#0f766e"/><text x="40" y="216" font-weight="700">2. Successor package</text><text x="40" y="244" font-size="15">execution_contract.json, source_manifest.json,</text><text x="40" y="266" font-size="15">successor_context.yaml, successor_prompt.md,</text><text x="40" y="288" font-size="15">validation_report.json</text><path d="M320 316 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="20" y="346" width="600" height="106" rx="14" fill="white" stroke="#0f766e"/><text x="40" y="376" font-weight="700">3. Validate, then continue</text><text x="40" y="404" font-size="15">Read validation_report.json and execution_contract.json. A failed</text><text x="40" y="426" font-size="15">handoff blocks continuation.</text><path d="M320 454 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="20" y="484" width="600" height="106" rx="14" fill="white" stroke="#0f766e"/><text x="40" y="514" font-weight="700">4. Successor chat</text><text x="40" y="542" font-size="15">Use successor_context.yaml and successor_prompt.md; inspect</text><text x="40" y="564" font-size="15">current repository state.</text></g></svg>
