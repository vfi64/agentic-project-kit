<svg xmlns="http://www.w3.org/2000/svg" width="360" height="754" viewBox="0 0 360 754" role="img" aria-labelledby="title desc"><title id="title">A bounded work cycle</title><desc id="desc">Make the selected change between start and check. Review the finish plan before execution; blocked or failed results stop the cycle.</desc><rect width="360" height="754" fill="#ecf5ef" rx="18"/><g font-family="system-ui,sans-serif" font-size="18" fill="#16302b"><text x="20" y="32" font-size="23" font-weight="700">A bounded work cycle</text><text x="20" y="72" font-size="13">Contract view · not a runtime trace</text><rect x="16" y="98" width="328" height="126" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="126" font-size="17" font-weight="700">1. work start</text><text x="30" y="158" font-size="15">Start a human patch/slice workflow</text><text x="30" y="180" font-size="15">with the safe standard startup</text><text x="30" y="202" font-size="15">sequence.</text><path d="M180 226 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="256" width="328" height="104" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="284" font-size="17" font-weight="700">2. work check</text><text x="30" y="316" font-size="15">Run common human workflow gates</text><text x="30" y="338" font-size="15">without committing or pushing.</text><path d="M180 362 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="392" width="328" height="148" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="420" font-size="17" font-weight="700">3. work finish</text><text x="30" y="452" font-size="15">Finish a human work slice by</text><text x="30" y="474" font-size="15">planning or executing commit,</text><text x="30" y="496" font-size="15">push, PR, merge, and closeout</text><text x="30" y="518" font-size="15">checks.</text><path d="M180 542 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="572" width="328" height="150" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="600" font-size="17" font-weight="700">4. transfer chat-switch-</text><text x="30" y="624" font-size="17" font-weight="700">complete</text><text x="30" y="656" font-size="15">Create a deterministic successor</text><text x="30" y="678" font-size="15">handoff package and prompt</text><text x="30" y="700" font-size="15">projections.</text></g></svg>
