<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="g2t g2d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" width="1000" height="470">
  <title id="g2t">A bounded work cycle</title>
  <desc id="g2d">Contract view of the default merge path of work finish. A successful dry run is PLANNED; any phase can block (BLOCKED, rc 2). Failed prerequisites block subsequent closeout stages; diagnostics may still run. PASS records successful completion, not semantic correctness. Plan: Finish a human work slice by planning or executing commit, push, PR, merge, and closeout checks. Dry run by default; successful prechecks yield PLANNED. Approve: Review the plan, then rerun with --execute. Execute: Default merge path: commit, handoff refresh, push and PR closeout. Failed prerequisites block subsequent closeout stages; diagnostics may still run. Record and continue: All steps successful: PASS. Otherwise BLOCKED, rc 2; inspect and fix the cause before planning again. Continue from the repository successor package.</desc>
  <defs>
    <marker id="g2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f766e" /></marker>
    <marker id="g2r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b42318" /></marker>
  </defs>
  <rect width="1000" height="470" rx="16" fill="#edf3f1" />
  <text x="24" y="36" font-size="20" font-weight="700" fill="#17202a">A bounded work cycle</text>
  <text x="24" y="58" font-size="13" fill="#586674">How agentic-kit work finish behaves · from the implemented result states</text>

  
  <rect x="24" y="84" width="176" height="104" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5" />
  <circle cx="46" cy="106" r="12" fill="#0f766e" /><text x="46" y="111" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="66" y="111" font-size="15" font-weight="700" fill="#17202a">Plan</text>
  <text x="38" y="138" font-size="13" fill="#17202a">Dry run by default</text>
  <text x="38" y="158" font-size="13" fill="#586674">after prechecks pass</text>
  <text x="38" y="178" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0f766e">STATE=PLANNED</text>

  
  <rect x="232" y="84" width="176" height="104" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5" />
  <circle cx="254" cy="106" r="12" fill="#0f766e" /><text x="254" y="111" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="274" y="111" font-size="15" font-weight="700" fill="#17202a">Approve</text>
  <text x="246" y="138" font-size="13" fill="#17202a">You review the plan</text>
  <text x="246" y="158" font-size="13" fill="#586674">and rerun explicitly</text>
  <text x="246" y="178" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0f766e">--execute</text>

  
  <rect x="440" y="84" width="184" height="104" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5" />
  <circle cx="462" cy="106" r="12" fill="#0f766e" /><text x="462" y="111" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="482" y="111" font-size="15" font-weight="700" fill="#17202a">Execute</text>
  <text x="454" y="138" font-size="13" fill="#17202a">commit · push · PR ·</text><text x="454" y="156" font-size="13" fill="#17202a">merge · handoff refresh</text>
  <text x="454" y="176" font-size="12" fill="#586674">requires passed checks</text>

  
  <path d="M712 96 L760 136 L712 176 L664 136 Z" fill="#fff" stroke="#17202a" stroke-width="1.5" />
  <text x="712" y="132" font-size="12" font-weight="700" fill="#17202a" text-anchor="middle">all steps</text>
  <text x="712" y="148" font-size="12" font-weight="700" fill="#17202a" text-anchor="middle">passed?</text>

  
  <rect x="796" y="84" width="180" height="104" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5" />
  <circle cx="818" cy="106" r="12" fill="#0f766e" /><text x="818" y="111" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="838" y="111" font-size="15" font-weight="700" fill="#17202a">Record</text>
  <text x="810" y="138" font-size="13" fill="#17202a">Steps and return</text>
  <text x="810" y="158" font-size="13" fill="#17202a">codes are reported</text>
  <text x="810" y="178" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0f766e">STATE=PASS</text>

  
  <rect x="796" y="250" width="180" height="104" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5" />
  <circle cx="818" cy="272" r="12" fill="#0f766e" /><text x="818" y="277" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="838" y="277" font-size="15" font-weight="700" fill="#17202a">Continue</text>
  <text x="810" y="304" font-size="13" fill="#17202a">Successor package</text><text x="810" y="324" font-size="13" fill="#17202a">is in the repository</text><text x="810" y="344" font-size="13" fill="#586674">a new chat can resume</text>

  
  <rect x="576" y="250" width="188" height="104" rx="10" fill="#fff" stroke="#b42318" stroke-width="1.5" stroke-dasharray="0" />
  <text x="592" y="277" font-size="15" font-weight="700" fill="#b42318">Blocked</text>
  <text x="592" y="304" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#b42318">STATE=BLOCKED · rc 2</text>
  <text x="592" y="324" font-size="13" fill="#17202a">failed steps listed</text>
  <text x="592" y="344" font-size="13" fill="#586674">diagnostics may still run</text>

  
  <line x1="200" y1="136" x2="228" y2="136" stroke="#0f766e" stroke-width="2" marker-end="url(#g2a)" />
  <line x1="408" y1="136" x2="436" y2="136" stroke="#0f766e" stroke-width="2" marker-end="url(#g2a)" />
  <line x1="624" y1="136" x2="660" y2="136" stroke="#0f766e" stroke-width="2" marker-end="url(#g2a)" />
  <line x1="760" y1="136" x2="792" y2="136" stroke="#0f766e" stroke-width="2" marker-end="url(#g2a)" />
  <text x="776" y="128" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle">yes</text>
  <line x1="886" y1="188" x2="886" y2="246" stroke="#0f766e" stroke-width="2" marker-end="url(#g2a)" />
  <line x1="712" y1="176" x2="712" y2="246" stroke="#b42318" stroke-width="2" marker-end="url(#g2r)" />
  <text x="720" y="216" font-size="12" font-weight="700" fill="#b42318">no</text>

  
  <path d="M576 302 H140 V192" fill="none" stroke="#b42318" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#g2r)" />
  <rect x="236" y="290" width="292" height="24" rx="4" fill="#edf3f1" />
  <text x="382" y="307" font-size="13" fill="#b42318" text-anchor="middle">fix the cause, then plan again · no blind retry</text>

  
  <path d="M886 354 V410 H84 V192" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#g2a)" />
  <rect x="356" y="398" width="300" height="24" rx="4" fill="#edf3f1" />
  <text x="506" y="415" font-size="13" fill="#0f766e" text-anchor="middle">next slice starts from the repository, not the chat</text>

  <text x="24" y="452" font-size="12" fill="#586674">Contract view: default merge path. Any phase can block. Release runs add signed approval gates.</text>
</svg>
