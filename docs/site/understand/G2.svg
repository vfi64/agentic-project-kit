<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-labelledby="title desc"><title id="title">A bounded work cycle</title><desc id="desc">Make the selected change between start and check. Review the finish plan before execution; blocked or failed results stop the cycle.</desc><rect width="640" height="600" fill="#ecf5ef" rx="18"/><g font-family="system-ui,sans-serif" font-size="18" fill="#16302b"><text x="24" y="40" font-size="23" font-weight="700">A bounded work cycle</text><rect x="20" y="70" width="600" height="106" rx="14" fill="white" stroke="#0f766e"/><text x="40" y="100" font-weight="700">1. work start</text><text x="40" y="128" font-size="15">Start a human patch/slice workflow with the safe standard startup</text><text x="40" y="150" font-size="15">sequence.</text><path d="M320 178 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="20" y="208" width="600" height="84" rx="14" fill="white" stroke="#0f766e"/><text x="40" y="238" font-weight="700">2. work check</text><text x="40" y="266" font-size="15">Run common human workflow gates without committing or pushing.</text><path d="M320 294 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="20" y="324" width="600" height="106" rx="14" fill="white" stroke="#0f766e"/><text x="40" y="354" font-weight="700">3. work finish</text><text x="40" y="382" font-size="15">Finish a human work slice by planning or executing commit, push,</text><text x="40" y="404" font-size="15">PR, merge, and closeout checks.</text><path d="M320 432 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="20" y="462" width="600" height="106" rx="14" fill="white" stroke="#0f766e"/><text x="40" y="492" font-weight="700">4. transfer chat-switch-complete</text><text x="40" y="520" font-size="15">Create a deterministic successor handoff package and prompt</text><text x="40" y="542" font-size="15">projections.</text></g></svg>
