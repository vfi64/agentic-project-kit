<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" viewBox="0 0 640 588" role="img" aria-labelledby="title desc"><title id="title">A bounded work cycle</title><desc id="desc">Make the selected change between start and check. Review the finish plan before execution; blocked or failed results stop the cycle.</desc><rect width="640" height="588" fill="#ecf5ef" rx="18"/><g font-family="system-ui,sans-serif" font-size="18" fill="#16302b"><text x="20" y="32" font-size="23" font-weight="700">A bounded work cycle</text><rect x="16" y="66" width="608" height="104" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="94" font-size="17" font-weight="700">1. work start</text><text x="30" y="126" font-size="15">Start a human patch/slice workflow with the safe standard startup</text><text x="30" y="148" font-size="15">sequence.</text><path d="M320 172 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="202" width="608" height="82" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="230" font-size="17" font-weight="700">2. work check</text><text x="30" y="262" font-size="15">Run common human workflow gates without committing or pushing.</text><path d="M320 286 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="316" width="608" height="104" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="344" font-size="17" font-weight="700">3. work finish</text><text x="30" y="376" font-size="15">Finish a human work slice by planning or executing commit, push,</text><text x="30" y="398" font-size="15">PR, merge, and closeout checks.</text><path d="M320 422 v24 m-5 -6 l5 6 5 -6" stroke="#0f766e" fill="none" stroke-width="2"/><rect x="16" y="452" width="608" height="104" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="480" font-size="17" font-weight="700">4. transfer chat-switch-complete</text><text x="30" y="512" font-size="15">Create a deterministic successor handoff package and prompt</text><text x="30" y="534" font-size="15">projections.</text></g></svg>
