<svg xmlns="http://www.w3.org/2000/svg" width="360" height="958" viewBox="0 0 360 958" role="img" aria-labelledby="title desc"><title id="title">Observed work and release entry</title><desc id="desc">CLI callback entries observed in a network-denied local sandbox. Fake GitHub and always-green test CI are model assumptions. Entries include plans and dry runs. Entry does not imply successful completion; no live release or complete command coverage is claimed. Source: 7a6173cab704d57322e3ad22ddf4c02096314b1d. Run status: BOUNDED_COMPLETE. Complete publication is outside this observation.</desc><rect width="360" height="958" fill="#ecf5ef" rx="18"/><g font-family="system-ui,sans-serif" font-size="18" fill="#16302b"><text x="20" y="32" font-size="23" font-weight="700">Observed work and</text><text x="20" y="62" font-size="23" font-weight="700">release entry</text><text x="20" y="102" font-size="13">Offline callback entries · 7a6173cab704</text><text x="20" y="122" font-size="13">Local Git + fake GitHub · no publication</text><rect x="16" y="148" width="328" height="148" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="176" font-size="17" font-weight="700">Caller: work start</text><text x="30" y="208" font-size="15">Direct callees: rules acknowledge;</text><text x="30" y="230" font-size="15">transfer branch-create; transfer</text><text x="30" y="252" font-size="15">post-merge-check; transfer repo-</text><text x="30" y="274" font-size="15">status; transfer sync-main</text><rect x="16" y="328" width="328" height="236" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="356" font-size="17" font-weight="700">Caller: work finish</text><text x="30" y="388" font-size="15">Direct callees: rules acknowledge;</text><text x="30" y="410" font-size="15">transfer chat-switch-complete;</text><text x="30" y="432" font-size="15">transfer commit; transfer post-</text><text x="30" y="454" font-size="15">merge-check; transfer pr-create-</text><text x="30" y="476" font-size="15">complete; transfer protected-diff-</text><text x="30" y="498" font-size="15">plan; transfer push-current;</text><text x="30" y="520" font-size="15">transfer repo-status; transfer</text><text x="30" y="542" font-size="15">sync-main</text><rect x="16" y="596" width="328" height="150" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="624" font-size="17" font-weight="700">Caller: transfer chat-</text><text x="30" y="648" font-size="17" font-weight="700">switch-complete</text><text x="30" y="680" font-size="15">Direct callees: No nested CLI</text><text x="30" y="702" font-size="15">callback observed; internal Python</text><text x="30" y="724" font-size="15">operations are outside this view.</text><rect x="16" y="778" width="328" height="148" rx="14" fill="white" stroke="#0f766e"/><text x="30" y="806" font-size="17" font-weight="700">Caller: release run</text><text x="30" y="838" font-size="15">Direct callees: release prepare;</text><text x="30" y="860" font-size="15">release ready; release-publish;</text><text x="30" y="882" font-size="15">transfer sync-main; work finish;</text><text x="30" y="904" font-size="15">work start</text></g></svg>
