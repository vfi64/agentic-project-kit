- id: command-surface-contract-coverage
  description: Command manifest surface classes must remain visible as role/disclosure
    metadata and must not be treated as safety, compatibility, deprecation, or
    stability metadata.
  documents:
  - path: README.md
    terms:
    - Command manifest surface classes
    - orchestrator
    - diagnostic
    - primitive
    - Surface classification is intent-oriented
    - Surface classification does not by itself change command safety, compatibility, or deprecation status
    - primitive does not mean unstable
    - agentic-kit command-for
    - tie-breaker after semantic task matching and safety checks
    - exact primitive matches are not displaced by broader orchestrators
    - GUI and website projections must consume this same generated `surface` field
    - diagnostic_priority
    - safety_review
    - claim_evidence
    - Guided Diagnostics common blockers
    - Primary (`orchestrator`)
    - Expert / Low-level (`primitive`)
  - path: docs/TEST_GATES.md
    terms:
    - Command manifest surface classes
    - role/disclosure contract
    - Valid values are `orchestrator`, `diagnostic`, and `primitive`
    - every command must have exactly one valid value
    - Surface classification is intent-oriented
    - "`diagnostic` must not be inferred from `READ_ONLY`"
    - Surface classification does not change command safety, compatibility, or deprecation status
    - primitive does not mean unstable
    - agentic-kit command-for
    - tie-breaker after semantic task matching and safety checks
    - exact primitive matches must not be displaced by broader orchestrators
    - diagnostic_priority
    - claim_evidence
    - safety_review
    - must not rewrite manifest `surface`
  - path: docs/governance/COMMAND_REFERENCE_REGISTRY_CONTRACT.md
    terms:
    - Command surface contract
    - Every generated command-reference entry must carry exactly one `surface` value
    - orchestrator
    - diagnostic
    - primitive
    - Surface classification is separate from command safety
    - Surface classification is intent-oriented
    - "`diagnostic` must not be inferred from `READ_ONLY`"
    - Surface classification does not by itself change the compatibility or deprecation contract
    - primitive does not mean unstable
    - agentic-kit command-for
    - only after semantic task matching and safety or prerequisite checks
    - Surface must not override a more exact task match
