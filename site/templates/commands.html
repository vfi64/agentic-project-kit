<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>${title} - ${product_name}</title>
    <link rel="stylesheet" href="../static/site.css">
  </head>
  <body>
    <main class="page">
      <nav class="topnav" aria-label="Site">
        <a href="../index.html">Overview</a>
        <a href="../quickstart/index.html">Quickstart</a>
        <a href="../workflows/index.html">Workflows</a>
        <a href="guided.html">Guided</a>
        <a href="diagnostics.html">Diagnostics</a>
        <a href="index.html">Complete</a>
        <a href="../claims/index.html">Claims</a>
      </nav>

      <section class="overview" aria-labelledby="command-title">
        <p class="eyebrow">Generated command catalog</p>
        <h1 id="command-title">${title}</h1>
        <p class="lede">${description}</p>
        <p class="catalog-meta">Version <code>${package_version}</code> · Manifest <code>${manifest_sha}</code> · Commands <code>${command_count}</code></p>
      </section>

      <section class="filter-panel" aria-label="Command filters">
        <label>Search <input id="command-search" type="search" placeholder="agentic-kit transfer"></label>
        <label>Safety
          <select id="safety-filter">
            <option value="">All</option>
            <option value="READ_ONLY">READ_ONLY</option>
            <option value="BOUNDED">BOUNDED</option>
            <option value="DESTRUCTIVE">DESTRUCTIVE</option>
          </select>
        </label>
        <label>Surface
          <select id="surface-filter">
            <option value="">All</option>
            <option value="orchestrator">orchestrator</option>
            <option value="diagnostic">diagnostic</option>
            <option value="primitive">primitive</option>
          </select>
        </label>
      </section>

      <section class="table-wrap" aria-label="${title}">
        <table>
          <thead>
            <tr>
              <th>Command</th>
              <th>Group</th>
              <th>Surface</th>
              <th>Safety</th>
              <th>Dry-run</th>
              <th>When to use</th>
              <th>Parameters</th>
              <th>Kit version</th>
              <th>Manifest</th>
            </tr>
          </thead>
          <tbody>
${rows}
          </tbody>
        </table>
      </section>
      <script>
        const rows = Array.from(document.querySelectorAll("tbody tr"));
        const search = document.querySelector("#command-search");
        const safety = document.querySelector("#safety-filter");
        const surface = document.querySelector("#surface-filter");
        function applyFilters() {
          const query = search.value.trim().toLowerCase();
          const safetyValue = safety.value;
          const surfaceValue = surface.value;
          for (const row of rows) {
            const text = row.dataset.commandText || "";
            const okQuery = !query || text.includes(query);
            const okSafety = !safetyValue || row.dataset.safety === safetyValue;
            const okSurface = !surfaceValue || row.dataset.surface === surfaceValue;
            row.hidden = !(okQuery && okSafety && okSurface);
          }
        }
        search.addEventListener("input", applyFilters);
        safety.addEventListener("change", applyFilters);
        surface.addEventListener("change", applyFilters);
      </script>
    </main>
  </body>
</html>
