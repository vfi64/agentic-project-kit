schema_version: 1
claims:
  - id: cli-entry-point
    text: The package provides the agentic-kit command-line interface.
    required: true
    evidence:
      type: pyproject-entrypoint
      script: agentic-kit
      target: agentic_project_kit.cli:app

  - id: gui-entry-point
    text: The package provides the agentic-kit-gui graphical entry point.
    required: false
    evidence:
      type: pyproject-entrypoint
      script: agentic-kit-gui
      target: agentic_project_kit.gui_cockpit:main

  - id: python-requirement
    text: The website Python requirement is projected from pyproject.toml.
    required: true
    evidence:
      type: pyproject-value
      key: project.requires-python

  - id: package-version
    text: The website package version is projected from pyproject.toml.
    required: true
    evidence:
      type: pyproject-value
      key: project.version

  - id: public-source-install-documented
    scope: documentation
    text: The GitHub source projection remains documented for unreleased fixes and Kit development.
    required: true
    evidence:
      - type: file-contains
        path: README.md
        contains: "agentic-project-kit @ git+https://github.com/vfi64/agentic-project-kit.git@main"

  - id: pypi-trusted-publishing-ready
    text: The release workflow configures the PyPI publishing action; this is configuration evidence, not a publication or installation test.
    required: false
    evidence:
      - type: file-contains
        path: .github/workflows/release.yml
        contains: "pypa/gh-action-pypi-publish@release/v1"

  - id: pypi-package-installable
    scope: historical-observation
    scope_note: The recorded retest installed 1.0.6 from PyPI; it does not establish current release installability or arbitrary-user compatibility.
    text: The recorded 1.0.6 retest installed agentic-project-kit from PyPI.
    required: true
    evidence:
      - type: file-contains
        path: docs/reports/POST_V1_0_6_B1_RULE_ACK_RELEASED_PACKAGE_RETEST_20260826.md
        contains: "Installed package: `agentic-project-kit==1.0.6` from PyPI"

  - id: command-manifest-synchronization
    text: The public command catalog is generated from the current command manifest and checked for synchronization.
    required: true
    evidence:
      type: command-probe
      command:
        - agentic-kit
        - audit-command-manifest
        - --json
      assertion:
        json_path: $.status
        equals: PASS

  - id: artifact-gc-dry-run
    text: agentic-kit artifact-gc supports dry-run behavior.
    required: false
    evidence:
      type: command-manifest
      qualified_name: agentic-kit artifact-gc
      dry_run_available: true

  - id: workspace-adopt-read-only
    text: agentic-kit workspace adopt inspects without writing.
    required: false
    evidence:
      - type: command-manifest
        qualified_name: agentic-kit workspace adopt
        safety: READ_ONLY
      - type: pytest-node
        node_id: tests/test_workspace_adopt.py::test_adopt_makes_no_writes

  - id: workspace-init-preview-execute
    text: agentic-kit workspace init previews changes before explicit execution.
    required: false
    evidence:
      - type: command-manifest
        qualified_name: agentic-kit workspace init
        dry_run_available: true
      - type: pytest-node
        node_id: tests/test_workspace_init.py::test_init_dry_run_writes_nothing_and_prints_tree
      - type: pytest-node
        node_id: tests/test_workspace_init.py::test_init_execute_creates_exact_tree_and_valid_manifest

  - id: successor-handoff-package
    text: The Kit can produce a structured successor handoff package for continuing work in another session or model.
    required: false
    evidence:
      type: pytest-node
      node_id: tests/test_successor_handoff_package.py::test_successor_handoff_artifacts_snapshot

  - id: generated-command-catalog
    text: The website command catalog is generated from the Kit's current command manifest.
    required: true
    evidence:
      type: generated-artifact
      producer:
        - python
        - site/scripts/build.py
      source: docs/reference/agentic-kit-commands.json
      output: commands/commands.json
      assertion: manifest-command-coverage

  - id: b1-brownfield-evaluable
    scope: historical-observation
    scope_note: The historical B1 window in one familiar repository does not establish current general Brownfield portability.
    text: In the historical B1 threshold window, five real Brownfield maintenance cycles reached the predeclared B1_EVALUABLE threshold while preserving the generalization boundary.
    required: true
    evidence:
      - type: file-contains
        path: docs/reports/POST_V1_0_5_B1_EVIDENCE_CLOSEOUT_20260826.json
        contains: '"status": "B1_EVALUABLE"'
      - type: file-contains
        path: docs/reports/POST_V1_0_5_B1_EVIDENCE_CLOSEOUT_20260826.md
        contains: "B1 is not a proof of general Brownfield portability."

  - id: current-release-pypi-workflow
    scope: historical-observation
    scope_note: C3 proves successful workflow completion for the version in pyproject.toml; index visibility and installability need separate observations.
    text: The PyPI publication workflow for the current package version completed successfully in its release run (C3).
    required: false
    evidence:
      type: release-pypi-workflow
