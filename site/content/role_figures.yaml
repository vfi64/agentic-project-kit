schema_version: 1
kind: website-role-figures
figures:
  asked-checked-enforced:
    published: true
    title: Asked, checked, enforced
    subtitle: How strongly a project rule binds an agent
    footnote: Branch protection is a GitHub setting. The Kit lists it as a setup task.
    asked: Agent instructions guide work. An agent can ignore them.
    checked:
      - Failures are reported and fail the CI run.
      - Without level 3, a red CI can still be merged.
    branch_protection: Required checks can block a merge only when a maintainer enables branch protection in GitHub.
  repository-memory:
    published: true
    title: The chat ends, the repository remembers
    subtitle: A later session can use the same agent or another one
    footnote: The successor package is local. Copy it explicitly to another machine. Chat history is not carried over.
    arrow_labels:
      writes: writes
      reads: reads
  path-chooser:
    published: true
    title: Which path fits your assistant?
    question: Where does your AI assistant work?
    footnote: The four paths are not equally mature.
  background-and-ownership:
    published: true
    title: What the Kit handles and what stays with you
    delegated_heading: Handled for you
    retained_heading: Stays with you
    delegated:
      - Code changes → your chosen assistant
      - Rules, checks and project memory → the Kit
    retained:
      - Requirements and priorities
      - Design and architecture decisions
      - Review and approval before merge
      - Git setup and repair
    operations: &git_operations Branch, PR, CI waiting, merge → Kit commands
    footnote: &simulation_boundary The generated-project walkthrough simulates GitHub and a passing CI result.
  kit-conductor:
    published: true
    title: You direct the work
    owner: You set the direction
    owner_detail: Decide, review and approve.
    kit: Agentic Project Kit
    controls:
      - Rules and contracts
      - Checks and gates
      - Repository memory and handoff
    executor_heading: Choose an assistant
    repository_heading: Git repository and GitHub
    operations: *git_operations
    footnote: *simulation_boundary
