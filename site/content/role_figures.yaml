  asked-checked-enforced:
    published: true
    title: Asked, checked, enforced
    subtitle: How strongly a project rule binds an agent
    footnote: Branch protection is a GitHub setting. The Kit lists it as a setup task.
    asked: Agent instructions guide work. An agent can ignore them.
    checked:
      - Failures are reported and fail the CI run.
      - Without level 3, a red CI can still be merged.
    branch_protection: Required checks can block a merge only when a maintainer enables branch protection in GitHub.
