    reviewed: "2026-11-18"
  - name: GitHub Copilot cloud agent
    path: Agent Direct
    instructions: Supports repository instructions and AGENTS.md; check the specific editor or agent surface.
    source: https://docs.github.com/en/copilot/reference/custom-instructions-support
    reviewed: "2026-11-18"
  - name: Browser chat
    path: Copy and Paste or File Transfer
    instructions: Paste the starter prompt and provide the relevant repository files when the chat has no repository access.
    source: ../workflows/index.html
    reviewed: "2026-11-18"
