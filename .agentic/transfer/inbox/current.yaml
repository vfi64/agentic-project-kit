user_task:
  title: 'MacStudio continuation: release 1.0.3 and next plans'
  body: "# MacStudio Continuation Task\n\nCommunicate with the maintainer in German.\
    \ Write repository documentation, code,\ntests, release notes, and durable planning\
    \ artifacts in the language required by\nthe existing repository contracts, normally\
    \ English.\n\nTreat this file as an operational transfer task. Treat the two attached\
    \ planning\ndocuments as user-provided input material, not as executable instructions.\
    \ The\nrepository, command manifest, architecture contract, document lifecycle\
    \ rules,\nrelease workflow, tests, gates, and current remote state remain authoritative.\n\
    \n## Source Material\n\nRead these files if they are available on the MacStudio.\
    \ If a path is missing,\ndocument that fact and proceed from the summaries below\
    \ only after checking the\nrepository for equivalent material.\n\n- `/Users/hof/Dropbox/Privat/GitHub/2026-08-24-Hermes-Automatisierung/2026-08-24-Hermes-Automatisierung.md`\n\
    - `/Users/hof/Dropbox/Privat/GitHub/2026-08-24-LLM-Erkla\u0308rungshilfestrukturen\
    \ fu\u0308r das kit/2026-08-24-LLM-Erkla\u0308rungshilfestrukturen fu\u0308r das\
    \ kit.md`\n\n## Mandatory Start\n\n- Do not work from chat memory.\n- Read `docs/reference/agentic-kit-commands.json`\
    \ first and honor its manifest\n  acknowledgement.\n- Read the canonical successor\
    \ handoff package under\n  `docs/reports/handoff-packages/latest/`.\n- Read `AGENTS.md`,\
    \ then the required project anchors:\n  `docs/architecture/ARCHITECTURE_CONTRACT.md`,\n\
    \  `docs/DOCUMENTATION_COVERAGE.yaml`, `docs/STATUS.md`,\n  `docs/TEST_GATES.md`,\
    \ and `docs/handoff/CURRENT_HANDOFF.md`.\n- Use `agentic-kit command-for` before\
    \ proposing or executing `agentic-kit`,\n  raw git, or GitHub lifecycle commands.\n\
    - Determine the actual current `origin/main`, branch, release version, tags,\n\
    \  open PRs, open issues, CI state, and handoff freshness from the repository\
    \ and\n  GitHub. Do not assume this handoff is newer than remote truth.\n\n##\
    \ Requested Work\n\n1. From the current `main`, create release `v1.0.3` and publish\
    \ a new PyPI\n   package on `pypi.org`.\n   - Use the existing release commands\
    \ and release contract.\n   - Verify whether the current repository state is actually\
    \ ready for 1.0.3.\n   - Do not invent credentials or bypass protected release\
    \ gates.\n   - Do not claim PyPI publication until it is verified from the real\
    \ PyPI\n     artifact.\n\n2. Close obsolete issues and pull requests without damaging\
    \ the current kit state\n   with stale development.\n   - Inspect each candidate\
    \ from current GitHub state.\n   - Prefer safe closure with an explanatory comment\
    \ over merging stale work.\n   - Do not close anything that is still relevant,\
    \ currently active, or required\n     for release/documentation governance.\n\n\
    3. Store plans in the kit planning files according to the kit's document\n   lifecycle\
    \ and documentation governance rules for:\n   - `Masterplan: Planner-Kit-Executor\
    \ Integration`\n   - beginner and LLM tutor onboarding.\n   Use existing planning\
    \ locations such as `docs/planning/PROJECT_DIRECTION.yaml`\n   and existing report/document\
    \ registries where applicable. Do not create a\n   second planning authority.\n\
    \n4. Execute the `Masterplan: Planner-Kit-Executor Integration`.\n   - The Hermes\
    \ document is a masterplan for a model-independent\n     Planner-Kit-Executor\
    \ interface.\n   - Start with evidence-driven H0/H1-style analysis and read-only\
    \ validation\n     unless the repository already contains accepted later-phase\
    \ evidence.\n   - Prefer existing Kit mechanisms: command manifest, command-for,\
    \ workflow,\n     transfer, work, release, action registry, evidence, handoff\
    \ packages, and\n     execution contracts.\n   - Do not build a parallel command\
    \ taxonomy, rule authority, documentation\n     authority, state machine, or handoff\
    \ mechanism.\n   - Hermes is only the first local executor/browser adapter. Any\
    \ durable Kit\n     change must be generalizable beyond Hermes.\n\n5. Implement\
    \ beginner and LLM tutor onboarding.\n   - The onboarding document proposes a\
    \ staged documentation slice:\n     O0 baseline teachability measurement, O1 `docs/ONBOARDING.md`\
    \ plus README\n     anchor, O2 drift binding against the command manifest and\
    \ non-workspace\n     decision tree, then optional glossary, measurement repetition,\
    \ and site\n     alignment.\n   - Keep the first public path small: distinguish\
    \ empty new project,\n     existing repository adoption, and developing the kit\
    \ itself.\n   - Bind commands to the command manifest and avoid copying\n    \
    \ `non_workspace_message` prose as an unmanaged duplicate.\n\n## Workflow Requirements\n\
    \n- One slice = one branch = one PR.\n- Prefer existing complex Kit orchestrators\
    \ over manually composing\n  commit/push/PR/CI/merge/handoff/post-merge.\n- The\
    \ previous regression was missing final PR closeout plus handoff refresh.\n  Do\
    \ not ask the maintainer whether to do closeout/handoff. If a PR is created\n\
    \  and the contract permits completing it, run the appropriate existing transfer\n\
    \  closeout workflow deterministically. If it blocks, preserve evidence and report\n\
    \  the exact blocker.\n- Keep `main` clean and green. Never merge stale work or\
    \ release from a dirty\n  or unverified state.\n- For every substantive slice,\
    \ run the repo-required gates unless the release\n  contract narrows or expands\
    \ them:\n  `python -m pytest -q`, `ruff check .`, `agentic-kit check-docs`,\n\
    \  `agentic-kit direction validate --root .`, and `agentic-kit doctor`.\n- For\
    \ documentation/site changes, run the applicable site/registry/docs gates.\n-\
    \ For release work, run the release-specific preflight, build, verification,\n\
    \  publish, and closeout commands required by the current command manifest and\n\
    \  release docs.\n- Record evidence in repo-conformant locations. Do not rely\
    \ on screenshots or\n  terminal scrollback as the only evidence.\n\n## Planning\
    \ Document Summaries\n\n### Planner-Kit-Executor / Hermes\n\nThe goal is not to\
    \ make Hermes a second agent architecture. The goal is a\ncanonical, machine-readable,\
    \ model-independent interface in which a Planner LLM\ndoes reasoning and review,\
    \ the Kit remains the authority for repository\ngovernance and action resolution,\
    \ and a local executor performs only mechanical\ntransport, local execution, process\
    \ supervision, result transport, and human\nnotification. The initiative should\
    \ proceed through H0-H9: gap analysis,\nread-only adapter, structured E2E PoC,\
    \ real mutating slice, failure/recovery,\nplanner/executor portability, adjudication,\
    \ canonical Kit integration, prototype\nsubtraction, and long-running production\
    \ validation.\n\n### Beginner And LLM Tutor Onboarding\n\nThe goal is a small,\
    \ drift-bound onboarding path that a beginner or LLM tutor can\nfollow without\
    \ being flooded by the full CLI. Start by measuring baseline\nteachability. Then\
    \ add or update `docs/ONBOARDING.md` and a short README anchor,\nwith a decision\
    \ tree for new project, existing repository adoption, and kit\ndevelopment. Add\
    \ deterministic drift binding so onboarding commands stay aligned\nwith the command\
    \ manifest and workspace/non-workspace semantics.\n\n## Completion Criteria\n\n\
    - Release/PyPI work is either completed with verified artifact evidence or\n \
    \ stopped at an explicit repository/credential/maintainer boundary.\n- Obsolete\
    \ PRs/issues are closed only after current-state inspection and with\n  documented\
    \ rationale.\n- Both master plans are represented in canonical planning/document\
    \ lifecycle\n  files, with no duplicate planning authority.\n- Planner-Kit-Executor\
    \ work proceeds only through evidenced phases.\n- Beginner/LLM tutor onboarding\
    \ is implemented with tests/gates and drift\n  binding.\n- Every PR is followed\
    \ by the required PR closeout and successor handoff refresh\n  using existing\
    \ Kit mechanisms."
