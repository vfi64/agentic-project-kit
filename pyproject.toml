[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-project-kit"
version = "0.5.0"
description = "Govern AI-assisted repository work with explicit contracts, gates, evidence, and handoffs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Volker Fickert" }
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "pydantic>=2.7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.urls]
Repository = "https://github.com/vfi64/agentic-project-kit"


[tool.hatch.build]
exclude = [
  "/.venv*",
  "/build",
  "/dist",
  "/tmp",
  "/site",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.mypy_cache",
  "/.git",
]

[project.scripts]
agentic-kit = "agentic_project_kit.cli:app"
agentic-kit-gui = "agentic_project_kit.gui_cockpit:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "gui: GUI and Tkinter cockpit tests.",
  "repo_state: tests that inspect live repository state or checked-in governance files.",
  "slow: slower integration or lifecycle tests.",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Keep the repository gate on the historical Ruff default rule families.
# Newer Ruff releases may expand their defaults; CI must not drift silently.
select = ["E4", "E7", "E9", "F"]
